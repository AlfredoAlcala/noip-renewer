name: No-IP Auto Renew

on:
  workflow_dispatch: # Allows you to run it manually
  schedule:
    - cron: '0 0 */15 * *' # Runs every 15 days automatically

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install Firefox
        uses: browser-actions/setup-firefox@v1

      - name: Run Renew Script
        env:
          # These use the secrets you already created in your settings
          NO_IP_USERNAME: ${{ secrets.NOIP_USERNAME }}
          NO_IP_PASSWORD: ${{ secrets.NOIP_PASSWORD }}
        run: python renew.py
      - name: Upload Error Screenshot
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: error-screenshot
          path: error.png
